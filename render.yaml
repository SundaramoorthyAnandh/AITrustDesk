# Render Blueprint — TrustDesk (free tier, one platform / three services)
#
#   • trustdesk-api       Node web service (Fastify + SQLite). Free tier has an
#                         EPHEMERAL disk, so SEED_ON_BOOT reseeds on every start.
#   • trustdesk-customer  Static site (Customer Complaint Portal).
#   • trustdesk-agent     Static site (Agent Console).
#
# The static sites receive the API base URL via VITE_API_URL, baked in at build
# time. We set it as an explicit `value` (not `fromService`) because Render appends
# a random suffix to a service whose name collides globally (the live API is
# `trustdesk-api-uk31`), and a `fromService` reference to the un-suffixed blueprint
# name resolves to nothing — leaving VITE_API_URL empty and the portal calling its
# own origin. Point API_HOST at the deployed API's real host. See DEPLOY.md.
#
# If you fork/redeploy under a different API host, update the two VITE_API_URL
# values below (and re-deploy the static sites so the new value is rebuilt in).
# CORS on the API already allows any *.onrender.com origin.

services:
  - type: web
    name: trustdesk-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install
    startCommand: npm run start -w backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SEED_ON_BOOT
        value: "true"
      - key: LLM_PROVIDER
        value: mock
      - key: CORS_ORIGINS
        value: https://*.onrender.com
      - key: ACCESS_TOKEN_TTL
        value: "900"
      - key: REFRESH_TOKEN_TTL
        value: "1209600"
      - key: SEED_DEFAULT_PASSWORD
        value: Password123!
      - key: CUSTOMER_JWT_SECRET
        generateValue: true
      - key: AGENT_JWT_SECRET
        generateValue: true

  - type: web
    name: trustdesk-customer
    runtime: static
    rootDir: .
    buildCommand: npm install && npm run build -w web/customer-portal
    staticPublishPath: web/customer-portal/dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: https://trustdesk-api-uk31.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: trustdesk-agent
    runtime: static
    rootDir: .
    buildCommand: npm install && npm run build -w web/agent-portal
    staticPublishPath: web/agent-portal/dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: https://trustdesk-api-uk31.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
