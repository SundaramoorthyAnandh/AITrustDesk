# SPA server: serve static assets, fall back to index.html for client-side routes.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Long-cache hashed build assets.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Client-side routing (React Router BrowserRouter).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
